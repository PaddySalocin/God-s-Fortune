<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC Interaction</title>
<link rel="manifest" crossorigin="use-credentials">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deepest:#0d0f13; --bg-dark:#141820; --bg-mid:#1a1f2a; --bg-card:#1e2433;
  --bg-card-hover:#252c3d; --border-dark:#2a3040; --border-mid:#3a4258;
  --text-bright:#e8eaf0; --text-mid:#a8b0c0; --text-dim:#6a7488; --text-muted:#444c5e;
  --gold:#c9a84c; --gold-dim:#8a7434; --gold-bright:#e8c85c;
  --green:#27ae60; --green-dim:#1e8449; --green-glow:rgba(39,174,96,0.35);
  --red:#c0392b; --red-bright:#e74c3c; --purple:#8e44ad; --purple-dim:#6c3483;
  --orange:#e67e22; --blue:#2980b9;
  --pc-accent:#3498db; --enemy-accent:#c0392b; --ally-accent:#27ae60;
  --font-display:'Cinzel', serif; --font-body:'EB Garamond', Georgia, serif;
  --font-mono:'JetBrains Mono', monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--bg-deepest); color:var(--text-bright); font-family:var(--font-body); font-size:16px; height:100vh; overflow:hidden; }

/* ===== LAYOUT ===== */
.gm-layout { display:grid; grid-template-columns:320px 1fr; height:100vh; }
.player-layout { display:flex; flex-direction:column; height:100vh; }

/* ===== GM SIDEBAR — NPC PROFILE ===== */
.npc-sidebar { background:var(--bg-dark); border-right:1px solid var(--border-dark); display:flex; flex-direction:column; overflow:hidden; }
.npc-sidebar-header { padding:12px 16px; border-bottom:1px solid var(--border-dark); display:flex; align-items:center; justify-content:space-between; }
.npc-sidebar-header h2 { font-family:var(--font-display); font-size:0.75rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--gold); }
.npc-sidebar-content { flex:1; overflow-y:auto; padding:12px; }
.npc-sidebar-content::-webkit-scrollbar { width:4px; }
.npc-sidebar-content::-webkit-scrollbar-thumb { background:var(--border-dark); border-radius:2px; }

/* Profile form */
.npc-field { margin-bottom:10px; }
.npc-field label { display:block; font-family:var(--font-display); font-size:0.5rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:3px; }
.npc-field input, .npc-field textarea, .npc-field select { width:100%; background:var(--bg-mid); border:1px solid var(--border-dark); border-radius:3px; color:var(--text-bright); font-family:var(--font-body); font-size:0.85rem; padding:6px 8px; }
.npc-field input:focus, .npc-field textarea:focus { border-color:var(--gold-dim); outline:none; }
.npc-field textarea { resize:vertical; min-height:48px; line-height:1.4; }

/* Portrait upload */
.npc-portrait-wrap { text-align:center; margin-bottom:12px; }
.npc-portrait-frame { width:120px; height:120px; margin:0 auto 8px; border:2px dashed var(--border-mid); border-radius:6px; overflow:hidden; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:border-color 0.2s; background:var(--bg-mid); }
.npc-portrait-frame:hover { border-color:var(--gold-dim); }
.npc-portrait-frame img { width:100%; height:100%; object-fit:cover; }
.npc-portrait-frame .placeholder { font-size:0.6rem; color:var(--text-muted); font-family:var(--font-display); letter-spacing:0.08em; text-transform:uppercase; }

/* Buttons */
.btn { font-family:var(--font-display); font-size:0.55rem; letter-spacing:0.08em; text-transform:uppercase; padding:5px 12px; border:1px solid var(--border-mid); border-radius:3px; background:var(--bg-mid); color:var(--text-mid); cursor:pointer; transition:all 0.15s; }
.btn:hover { background:var(--bg-card-hover); color:var(--text-bright); border-color:var(--gold-dim); }
.btn-gold { border-color:var(--gold-dim); color:var(--gold); }
.btn-gold:hover { background:rgba(201,168,76,0.15); }
.btn-green { border-color:var(--green-dim); color:var(--green); }
.btn-green:hover { background:rgba(39,174,96,0.15); }
.btn-red { border-color:var(--red); color:var(--red-bright); }
.btn-red:hover { background:rgba(192,57,43,0.15); }
.btn-row { display:flex; gap:6px; flex-wrap:wrap; }

/* ===== CHAT AREA ===== */
.chat-area { display:flex; flex-direction:column; background:var(--bg-deepest); overflow:hidden; }
.chat-header { padding:12px 20px; border-bottom:1px solid var(--border-dark); background:var(--bg-dark); display:flex; align-items:center; gap:12px; flex-shrink:0; }
.chat-header .npc-name { font-family:var(--font-display); font-size:1rem; letter-spacing:0.06em; color:var(--gold); }
.chat-header .npc-status { font-size:0.7rem; color:var(--text-dim); font-style:italic; }
.chat-header .ch-portrait { width:36px; height:36px; border-radius:4px; border:1px solid var(--border-mid); object-fit:cover; }

.chat-log { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:12px; }
.chat-log::-webkit-scrollbar { width:4px; }
.chat-log::-webkit-scrollbar-thumb { background:var(--border-dark); border-radius:2px; }

/* Chat bubbles */
.chat-msg { max-width:80%; animation:msg-in 0.3s ease-out; }
@keyframes msg-in { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
.chat-msg.from-player { align-self:flex-end; }
.chat-msg.from-npc { align-self:flex-start; }
.chat-msg .msg-sender { font-family:var(--font-display); font-size:0.5rem; letter-spacing:0.1em; text-transform:uppercase; margin-bottom:3px; }
.chat-msg.from-player .msg-sender { color:var(--pc-accent); text-align:right; }
.chat-msg.from-npc .msg-sender { color:var(--gold); }
.chat-msg .msg-bubble { padding:10px 14px; border-radius:8px; font-size:0.95rem; line-height:1.5; }
.chat-msg.from-player .msg-bubble { background:rgba(52,152,219,0.12); border:1px solid rgba(52,152,219,0.2); border-radius:8px 8px 2px 8px; }
.chat-msg.from-npc .msg-bubble { background:rgba(201,168,76,0.08); border:1px solid rgba(201,168,76,0.15); border-radius:8px 8px 8px 2px; }
.msg-bubble em { color:var(--gold); font-style:italic; }

/* Typing indicator */
.typing-indicator { align-self:flex-start; padding:8px 14px; background:rgba(201,168,76,0.06); border:1px solid rgba(201,168,76,0.1); border-radius:8px; display:none; }
.typing-indicator.visible { display:flex; gap:4px; align-items:center; }
.typing-dot { width:6px; height:6px; background:var(--gold-dim); border-radius:50%; animation:typing-bounce 1.4s ease-in-out infinite; }
.typing-dot:nth-child(2) { animation-delay:0.2s; }
.typing-dot:nth-child(3) { animation-delay:0.4s; }
@keyframes typing-bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }

/* Player input */
.chat-input-bar { padding:12px 20px; border-top:1px solid var(--border-dark); background:var(--bg-dark); display:flex; gap:8px; flex-shrink:0; }
.chat-input-bar input { flex:1; background:var(--bg-mid); border:1px solid var(--border-dark); border-radius:4px; color:var(--text-bright); font-family:var(--font-body); font-size:0.95rem; padding:10px 14px; }
.chat-input-bar input:focus { border-color:var(--gold-dim); outline:none; }
.chat-input-bar input::placeholder { color:var(--text-muted); font-style:italic; }
.chat-input-bar button { padding:10px 20px; font-size:0.6rem; }
.chat-input-bar .btn-mic { padding:10px 12px; font-size:1rem; min-width:unset; }
.chat-input-bar .btn-mic.recording { background:rgba(192,57,43,0.2); border-color:var(--red); color:var(--red-bright); animation:mic-pulse 1s ease-in-out infinite; }
@keyframes mic-pulse { 0%,100%{box-shadow:none} 50%{box-shadow:0 0 12px rgba(192,57,43,0.4)} }

/* ===== GM DRAFT REVIEW ===== */
.draft-area { border-top:1px solid var(--border-dark); background:var(--bg-dark); flex-shrink:0; padding:12px 20px; display:none; }
.draft-area.visible { display:block; }
.draft-label { font-family:var(--font-display); font-size:0.5rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); margin-bottom:6px; }
.draft-text { width:100%; background:var(--bg-mid); border:1px solid var(--gold-dim); border-radius:4px; color:var(--text-bright); font-family:var(--font-body); font-size:0.95rem; padding:10px 14px; line-height:1.5; resize:vertical; min-height:60px; }
.draft-text:focus { outline:none; border-color:var(--gold); }
.draft-actions { display:flex; gap:8px; margin-top:8px; justify-content:flex-end; }

/* ===== GM EMPTY STATE ===== */
.gm-empty { display:flex; align-items:center; justify-content:center; flex:1; }
.gm-empty-inner { text-align:center; opacity:0.4; }
.gm-empty-inner .icon { font-size:2.5rem; margin-bottom:12px; }
.gm-empty-inner .label { font-family:var(--font-display); font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--text-dim); }

/* ===== PLAYER EMPTY STATE ===== */
.player-empty { flex:1; display:flex; align-items:center; justify-content:center; }
.player-empty-inner { text-align:center; }
.player-empty-inner .icon { font-size:3rem; margin-bottom:16px; opacity:0.3; }
.player-empty-inner .label { font-family:var(--font-display); font-size:0.75rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--text-dim); }

/* Player portrait header */
.player-npc-header { display:none; align-items:center; gap:16px; padding:16px 24px; border-bottom:1px solid var(--border-dark); background:var(--bg-dark); flex-shrink:0; }
.player-npc-header.active { display:flex; }
.player-npc-header .pnh-portrait { width:64px; height:64px; border-radius:6px; border:2px solid var(--gold-dim); object-fit:cover; }
.player-npc-header .pnh-name { font-family:var(--font-display); font-size:1.2rem; letter-spacing:0.06em; color:var(--gold); }
.player-npc-header .pnh-desc { font-size:0.85rem; color:var(--text-dim); font-style:italic; margin-top:2px; }

/* Player window hides GM stuff */
body.player-window .gm-layout { display:none !important; }
body:not(.player-window) .player-layout { display:none !important; }
</style>
</head>
<body>

<!-- ============================================================
     GM VIEW
     ============================================================ -->
<div class="gm-layout">
  <div class="npc-sidebar">
    <div class="npc-sidebar-header">
      <h2>NPC Profile</h2>
      <div class="btn-row">
        <button class="btn" onclick="importProfile()">Import</button>
        <button class="btn" onclick="exportProfile()">Export</button>
      </div>
    </div>
    <div class="npc-sidebar-content">
      <div class="npc-portrait-wrap">
        <div class="npc-portrait-frame" id="gmPortraitFrame" onclick="document.getElementById('portraitInput').click()">
          <span class="placeholder">Click to upload</span>
        </div>
        <input type="file" id="portraitInput" accept="image/*" style="display:none">
      </div>
      <div class="npc-field"><label>Name</label><input type="text" id="npcName" placeholder="NPC name"></div>
      <div class="npc-field"><label>Voice &amp; Speech</label><textarea id="npcVoice" rows="2" placeholder="Speech patterns, verbal quirks, accent notes…"></textarea></div>
      <div class="npc-field"><label>Personality</label><textarea id="npcPersonality" rows="2" placeholder="Temperament, demeanor, quirks…"></textarea></div>
      <div class="npc-field"><label>Background</label><textarea id="npcBackground" rows="3" placeholder="Who they are, what they do, where they're from…"></textarea></div>
      <div class="npc-field"><label>Knowledge</label><textarea id="npcKnowledge" rows="3" placeholder="What they know that's relevant to the party…"></textarea></div>
      <div class="npc-field"><label>Secrets</label><textarea id="npcSecrets" rows="2" placeholder="What they can reveal, under what conditions…"></textarea></div>
      <div class="npc-field"><label>Boundaries</label><textarea id="npcBoundaries" rows="2" placeholder="What they don't know or won't discuss…"></textarea></div>
      <div class="npc-field"><label>Attitude toward party</label><textarea id="npcAttitude" rows="1" placeholder="Friendly, hostile, neutral, wary…"></textarea></div>
      <div class="npc-field"><label>Additional Context</label><textarea id="npcContext" rows="2" placeholder="Current scene, recent events, anything else…"></textarea></div>
      <div class="npc-field"><label>ElevenLabs Voice ID</label><input type="text" id="npcVoiceId" placeholder="e.g. pNInz6obpgDQGcFmaJgB"></div>
      <div class="npc-field" style="margin-bottom:4px">
        <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
          <input type="checkbox" id="ttsEnabled" style="width:auto;accent-color:var(--gold)"> Enable Voice (ElevenLabs TTS)
        </label>
      </div>
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border-dark)">
        <div class="npc-field"><label>Anthropic API Key</label><input type="password" id="apiKeyInput" placeholder="sk-ant-…" onchange="saveApiKey()"></div>
        <div style="font-size:0.6rem;color:var(--text-muted);margin-top:-6px;margin-bottom:8px">Stored in localStorage. Never sent anywhere except Anthropic's API.</div>
        <div class="npc-field"><label>ElevenLabs API Key</label><input type="password" id="elevenKeyInput" placeholder="xi-…" onchange="saveElevenKey()"></div>
        <div style="font-size:0.6rem;color:var(--text-muted);margin-top:-6px;margin-bottom:8px">Stored in localStorage. Never sent anywhere except ElevenLabs' API.</div>
      </div>
      <div style="margin-top:8px">
        <button class="btn btn-gold" onclick="startInteraction()" style="width:100%">▶ Start Interaction</button>
      </div>
      <div style="margin-top:8px">
        <button class="btn btn-red" onclick="endInteraction()" style="width:100%" id="gmEndBtn" disabled>■ End Interaction</button>
      </div>
    </div>
  </div>

  <div class="chat-area" id="gmChatArea">
    <div class="gm-empty" id="gmEmpty">
      <div class="gm-empty-inner">
        <div class="icon">🎭</div>
        <div class="label">Set up an NPC profile and start interaction</div>
      </div>
    </div>
    <div class="chat-header" id="gmChatHeader" style="display:none">
      <img class="ch-portrait" id="gmChatPortrait" src="" alt="">
      <div>
        <div class="npc-name" id="gmChatName"></div>
        <div class="npc-status" id="gmChatStatus">Active</div>
      </div>
    </div>
    <div class="chat-log" id="gmChatLog" style="display:none"></div>
    <div class="draft-area" id="draftArea">
      <div class="draft-label">Draft Response — Edit and Approve</div>
      <textarea class="draft-text" id="draftText"></textarea>
      <div class="draft-actions">
        <button class="btn btn-red" onclick="rejectDraft()">✕ Reject</button>
        <button class="btn" onclick="regenerateDraft()">🔄 Regenerate</button>
        <button class="btn btn-green" onclick="approveDraft()">✓ Approve &amp; Send</button>
      </div>
    </div>
    <audio id="ttsAudioGM" style="display:none"></audio>
  </div>
</div>

<!-- ============================================================
     PLAYER VIEW
     ============================================================ -->
<div class="player-layout">
  <div class="player-empty" id="playerEmpty">
    <div class="player-empty-inner">
      <div class="icon">🎭</div>
      <div class="label">Waiting for the Gamemaster…</div>
    </div>
  </div>
  <div class="player-npc-header" id="playerNpcHeader">
    <img class="pnh-portrait" id="playerPortrait" src="" alt="">
    <div>
      <div class="pnh-name" id="playerNpcName"></div>
      <div class="pnh-desc" id="playerNpcDesc"></div>
    </div>
  </div>
  <div class="chat-log" id="playerChatLog" style="display:none"></div>
  <div class="typing-indicator" id="playerTyping">
    <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
  </div>
  <div class="chat-input-bar" id="playerInputBar" style="display:none">
    <button class="btn btn-mic" id="micBtn" onclick="toggleMic()" title="Voice input">🎤</button>
    <input type="text" id="playerInput" placeholder="Speak to the NPC…" onkeydown="if(event.key==='Enter')sendPlayerMsg()">
    <button class="btn btn-gold" onclick="sendPlayerMsg()">Send</button>
  </div>
  <audio id="ttsAudio" style="display:none"></audio>
</div>

<input type="file" id="importFileInput" accept=".json" style="display:none">

<script>
// ===== DETECT MODE =====
const IS_PLAYER = new URLSearchParams(window.location.search).has('player');
if (IS_PLAYER) document.body.classList.add('player-window');

// ===== BROADCAST CHANNEL =====
let syncChannel = null;
try { syncChannel = new BroadcastChannel('npc_interact_sync'); } catch(e) {}

// ===== STATE =====
let npcProfile = null;
let conversationHistory = []; // {role: 'player'|'npc', name: string, text: string}
let interactionActive = false;
let pendingPlayerMsg = null;
let portraitData = null;

// ===== API KEY =====
function saveApiKey() { localStorage.setItem('gf_anthropic_key', document.getElementById('apiKeyInput').value.trim()); }
function loadApiKey() { const k = localStorage.getItem('gf_anthropic_key'); if (k) document.getElementById('apiKeyInput').value = k; return k || ''; }
function saveElevenKey() { localStorage.setItem('gf_eleven_key', document.getElementById('elevenKeyInput').value.trim()); }
function loadElevenKey() { const k = localStorage.getItem('gf_eleven_key'); if (k) document.getElementById('elevenKeyInput').value = k; return k || ''; }
if (!IS_PLAYER) { loadApiKey(); loadElevenKey(); }

// ===== NPC PROFILE =====
function getProfileFromForm() {
  return {
    name: document.getElementById('npcName').value.trim(),
    portrait: portraitData,
    voice: document.getElementById('npcVoice').value.trim(),
    personality: document.getElementById('npcPersonality').value.trim(),
    background: document.getElementById('npcBackground').value.trim(),
    knowledge: document.getElementById('npcKnowledge').value.trim(),
    secrets: document.getElementById('npcSecrets').value.trim(),
    boundaries: document.getElementById('npcBoundaries').value.trim(),
    attitude: document.getElementById('npcAttitude').value.trim(),
    context: document.getElementById('npcContext').value.trim(),
    voiceId: document.getElementById('npcVoiceId').value.trim(),
    ttsEnabled: document.getElementById('ttsEnabled').checked
  };
}

function loadProfileToForm(p) {
  document.getElementById('npcName').value = p.name || '';
  document.getElementById('npcVoice').value = p.voice || '';
  document.getElementById('npcPersonality').value = p.personality || '';
  document.getElementById('npcBackground').value = p.background || '';
  document.getElementById('npcKnowledge').value = p.knowledge || '';
  document.getElementById('npcSecrets').value = p.secrets || '';
  document.getElementById('npcBoundaries').value = p.boundaries || '';
  document.getElementById('npcAttitude').value = p.attitude || '';
  document.getElementById('npcContext').value = p.context || '';
  document.getElementById('npcVoiceId').value = p.voiceId || '';
  document.getElementById('ttsEnabled').checked = !!p.ttsEnabled;
  if (p.portrait) {
    portraitData = p.portrait;
    document.getElementById('gmPortraitFrame').innerHTML = '<img src="' + p.portrait + '" alt="Portrait">';
  }
}

function exportProfile() {
  const p = getProfileFromForm();
  const blob = new Blob([JSON.stringify(p, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (p.name || 'NPC') + '_Profile.json';
  a.click();
}

function importProfile() {
  document.getElementById('importFileInput').click();
}

document.getElementById('importFileInput').addEventListener('change', function(e) {
  if (!e.target.files.length) return;
  const reader = new FileReader();
  reader.onload = function(re) {
    try {
      const p = JSON.parse(re.target.result);
      loadProfileToForm(p);
    } catch(err) { alert('Invalid profile JSON'); }
  };
  reader.readAsText(e.target.files[0]);
  e.target.value = '';
});

// Portrait upload
document.getElementById('portraitInput').addEventListener('change', function(e) {
  if (!e.target.files.length) return;
  const reader = new FileReader();
  reader.onload = function(re) {
    portraitData = re.target.result;
    document.getElementById('gmPortraitFrame').innerHTML = '<img src="' + portraitData + '" alt="Portrait">';
  };
  reader.readAsDataURL(e.target.files[0]);
  e.target.value = '';
});

// ===== INTERACTION LIFECYCLE =====
function startInteraction() {
  npcProfile = getProfileFromForm();
  if (!npcProfile.name) { alert('Enter an NPC name'); return; }
  interactionActive = true;
  conversationHistory = [];

  // Show GM chat
  document.getElementById('gmEmpty').style.display = 'none';
  document.getElementById('gmChatHeader').style.display = 'flex';
  document.getElementById('gmChatLog').style.display = 'flex';
  document.getElementById('gmChatLog').innerHTML = '';
  document.getElementById('gmChatName').textContent = npcProfile.name;
  document.getElementById('gmChatStatus').textContent = 'Active';
  if (portraitData) document.getElementById('gmChatPortrait').src = portraitData;
  document.getElementById('gmEndBtn').disabled = false;

  // Broadcast to player
  if (syncChannel) {
    syncChannel.postMessage({
      type: 'npc_start',
      name: npcProfile.name,
      portrait: portraitData,
      personality: npcProfile.personality
    });
  }
}

function endInteraction() {
  interactionActive = false;
  document.getElementById('gmChatStatus').textContent = 'Ended';
  document.getElementById('draftArea').classList.remove('visible');
  document.getElementById('gmEndBtn').disabled = true;
  if (syncChannel) syncChannel.postMessage({type: 'npc_end'});
}

// ===== CHAT RENDERING =====
function appendMsg(container, role, name, text) {
  const div = document.createElement('div');
  div.className = 'chat-msg from-' + role;
  div.innerHTML = '<div class="msg-sender">' + name + '</div><div class="msg-bubble">' + text + '</div>';
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

// ===== CLAUDE API =====
function buildSystemPrompt() {
  const p = npcProfile;
  let sys = 'You are roleplaying as ' + p.name + ', a non-player character in a tabletop RPG conversation.\n\n';
  sys += 'CRITICAL RULES:\n';
  sys += '- Stay completely in character at all times. Never break character or acknowledge being an AI.\n';
  sys += '- Respond ONLY as ' + p.name + ' would — with their speech patterns, knowledge limits, and personality.\n';
  sys += '- Keep responses concise — typically 1-3 short paragraphs of dialogue/action. This is a conversation, not a monologue.\n';
  sys += '- Use *asterisks* for actions/descriptions sparingly. Focus on dialogue.\n\n';
  if (p.voice) sys += 'VOICE & SPEECH PATTERNS:\n' + p.voice + '\n\n';
  if (p.personality) sys += 'PERSONALITY:\n' + p.personality + '\n\n';
  if (p.background) sys += 'BACKGROUND:\n' + p.background + '\n\n';
  if (p.knowledge) sys += 'WHAT YOU KNOW:\n' + p.knowledge + '\n\n';
  if (p.secrets) sys += 'SECRETS (reveal only under the right conditions):\n' + p.secrets + '\n\n';
  if (p.boundaries) sys += 'WHAT YOU DO NOT KNOW / WILL NOT DISCUSS:\n' + p.boundaries + '\n\n';
  if (p.attitude) sys += 'ATTITUDE TOWARD THE PARTY:\n' + p.attitude + '\n\n';
  if (p.context) sys += 'CURRENT SCENE CONTEXT:\n' + p.context + '\n\n';
  return sys;
}

function buildMessages() {
  const msgs = [];
  for (const entry of conversationHistory) {
    if (entry.role === 'player') {
      msgs.push({role: 'user', content: entry.name + ' says: "' + entry.text + '"'});
    } else {
      msgs.push({role: 'assistant', content: entry.text});
    }
  }
  // Add pending player message
  if (pendingPlayerMsg) {
    msgs.push({role: 'user', content: pendingPlayerMsg.name + ' says: "' + pendingPlayerMsg.text + '"'});
  }
  return msgs;
}

async function generateDraft() {
  document.getElementById('gmChatStatus').textContent = 'Thinking…';
  try {
    const apiKey = document.getElementById('apiKeyInput').value.trim();
    if (!apiKey) {
      document.getElementById('draftText').value = '[No API key — enter your key in the sidebar, or write the response manually]';
      document.getElementById('draftArea').classList.add('visible');
      document.getElementById('gmChatStatus').textContent = 'No API key';
      return;
    }
    const headers = {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    };
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: headers,
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: buildSystemPrompt(),
        messages: buildMessages()
      })
    });
    const data = await response.json();
    const text = data.content.map(function(b) { return b.text || ''; }).filter(Boolean).join('\n');
    document.getElementById('draftText').value = text;
    document.getElementById('draftArea').classList.add('visible');
    document.getElementById('gmChatStatus').textContent = 'Draft ready — review and approve';
  } catch(err) {
    console.error('API error:', err);
    document.getElementById('draftText').value = '[API error — write response manually]';
    document.getElementById('draftArea').classList.add('visible');
    document.getElementById('gmChatStatus').textContent = 'API error — edit manually';
  }
}

// ===== DRAFT REVIEW =====
async function approveDraft() {
  const text = document.getElementById('draftText').value.trim();
  if (!text) return;

  // Add pending player msg to history if exists
  if (pendingPlayerMsg) {
    conversationHistory.push({role: 'player', name: pendingPlayerMsg.name, text: pendingPlayerMsg.text});
    pendingPlayerMsg = null;
  }

  // Add NPC response to history
  conversationHistory.push({role: 'npc', name: npcProfile.name, text: text});

  // Show on GM side
  appendMsg(document.getElementById('gmChatLog'), 'npc', npcProfile.name, formatMsg(text));

  // Send text to player
  if (syncChannel) {
    syncChannel.postMessage({type: 'npc_msg', role: 'npc', name: npcProfile.name, text: text});
  }

  document.getElementById('draftArea').classList.remove('visible');
  document.getElementById('gmChatStatus').textContent = 'Active';

  // Generate and broadcast TTS audio (async, non-blocking)
  if (npcProfile.ttsEnabled && npcProfile.voiceId) {
    document.getElementById('gmChatStatus').textContent = 'Generating voice…';
    const audioBlob = await generateTTS(text);
    if (audioBlob && syncChannel) {
      const audioData = await blobToBase64(audioBlob);
      syncChannel.postMessage({type: 'npc_audio', audio: audioData});
      // Also play on GM side for monitoring
      playTTSBlob(audioBlob);
    }
    document.getElementById('gmChatStatus').textContent = 'Active';
  }
}

function rejectDraft() {
  document.getElementById('draftArea').classList.remove('visible');
  document.getElementById('gmChatStatus').textContent = 'Draft rejected — waiting';
  pendingPlayerMsg = null;
  // Tell player typing stopped
  if (syncChannel) syncChannel.postMessage({type: 'npc_typing', typing: false});
}

async function regenerateDraft() {
  document.getElementById('draftText').value = '';
  await generateDraft();
}

function formatMsg(text) {
  // Convert *action* to styled emphasis
  return text.replace(/\*([^*]+)\*/g, '<em>$1</em>');
}

// ===== PLAYER MESSAGE HANDLING (GM side) =====
function handlePlayerMessage(name, text) {
  if (!interactionActive) return;

  // Show on GM log
  appendMsg(document.getElementById('gmChatLog'), 'player', name, formatMsg(text));

  // Set pending and generate draft
  pendingPlayerMsg = {name: name, text: text};
  generateDraft();
}

// ===== PLAYER SIDE =====
function playerShowNpc(name, portrait, personality) {
  document.getElementById('playerEmpty').style.display = 'none';
  document.getElementById('playerNpcHeader').classList.add('active');
  document.getElementById('playerChatLog').style.display = 'flex';
  document.getElementById('playerInputBar').style.display = 'flex';
  document.getElementById('playerChatLog').innerHTML = '';
  document.getElementById('playerNpcName').textContent = name;
  document.getElementById('playerNpcDesc').textContent = personality || '';
  if (portrait) document.getElementById('playerPortrait').src = portrait;
}

function playerHideNpc() {
  document.getElementById('playerEmpty').style.display = 'flex';
  document.getElementById('playerNpcHeader').classList.remove('active');
  document.getElementById('playerChatLog').style.display = 'none';
  document.getElementById('playerInputBar').style.display = 'none';
  document.getElementById('playerTyping').classList.remove('visible');
}

function sendPlayerMsg() {
  const input = document.getElementById('playerInput');
  const text = input.value.trim();
  if (!text) return;

  // Show locally
  appendMsg(document.getElementById('playerChatLog'), 'player', 'Party', formatMsg(text));
  input.value = '';

  // Send to GM
  if (syncChannel) {
    syncChannel.postMessage({type: 'player_speak', name: 'Party', text: text});
  }
}

// ===== VOICE INPUT =====
let recognition = null;
let isRecording = false;

function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    alert('Speech recognition not supported in this browser');
    return;
  }
  if (isRecording) {
    recognition.stop();
    return;
  }
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = 'en-US';

  recognition.onstart = function() {
    isRecording = true;
    document.getElementById('micBtn').classList.add('recording');
  };
  recognition.onresult = function(e) {
    const text = e.results[0][0].transcript;
    document.getElementById('playerInput').value = text;
  };
  recognition.onend = function() {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };
  recognition.onerror = function() {
    isRecording = false;
    document.getElementById('micBtn').classList.remove('recording');
  };
  recognition.start();
}

// ===== ELEVENLABS TTS =====
async function generateTTS(text) {
  if (!npcProfile || !npcProfile.ttsEnabled || !npcProfile.voiceId) return null;
  const elevenKey = document.getElementById('elevenKeyInput').value.trim();
  if (!elevenKey) { console.warn('No ElevenLabs API key'); return null; }

  // Strip action markers for cleaner speech
  const cleanText = text.replace(/\*([^*]+)\*/g, '$1');

  try {
    const response = await fetch('https://api.elevenlabs.io/v1/text-to-speech/' + npcProfile.voiceId, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'xi-api-key': elevenKey
      },
      body: JSON.stringify({
        text: cleanText,
        model_id: 'eleven_multilingual_v2',
        voice_settings: {
          stability: 0.5,
          similarity_boost: 0.75
        }
      })
    });
    if (!response.ok) { console.warn('ElevenLabs error:', response.status); return null; }
    const blob = await response.blob();
    return blob;
  } catch(err) {
    console.warn('ElevenLabs fetch error:', err);
    return null;
  }
}

function playTTSBlob(blob) {
  if (!blob) return;
  const audio = document.getElementById(IS_PLAYER ? 'ttsAudio' : 'ttsAudioGM');
  if (!audio) return;
  const url = URL.createObjectURL(blob);
  audio.src = url;
  audio.play().catch(function(e) { console.warn('Audio autoplay blocked:', e); });
  audio.onended = function() { URL.revokeObjectURL(url); };
}

// Convert blob to base64 for broadcast
function blobToBase64(blob) {
  return new Promise(function(resolve) {
    const reader = new FileReader();
    reader.onloadend = function() { resolve(reader.result); };
    reader.readAsDataURL(blob);
  });
}

// Player side: receive and play base64 audio
function playTTSBase64(dataUrl) {
  if (!dataUrl) return;
  const audio = document.getElementById('ttsAudio');
  audio.src = dataUrl;
  audio.play().catch(function(e) { console.warn('Audio autoplay blocked:', e); });
}

// ===== BROADCAST CHANNEL HANDLERS =====
if (syncChannel) {
  syncChannel.onmessage = function(e) {
    const msg = e.data;

    if (IS_PLAYER) {
      // Player receives
      switch(msg.type) {
        case 'npc_start':
          playerShowNpc(msg.name, msg.portrait, msg.personality);
          break;
        case 'npc_end':
          playerHideNpc();
          break;
        case 'npc_msg':
          document.getElementById('playerTyping').classList.remove('visible');
          appendMsg(document.getElementById('playerChatLog'), msg.role, msg.name, formatMsg(msg.text));
          break;
        case 'npc_typing':
          document.getElementById('playerTyping').classList.toggle('visible', msg.typing);
          break;
        case 'npc_audio':
          playTTSBase64(msg.audio);
          break;
        case 'player_msg_echo':
          // GM confirmed receipt — could show a check mark
          break;
      }
    } else {
      // GM receives
      switch(msg.type) {
        case 'player_speak':
          handlePlayerMessage(msg.name, msg.text);
          // Echo typing indicator to player
          if (syncChannel) syncChannel.postMessage({type: 'npc_typing', typing: true});
          break;
      }
    }
  };
}
